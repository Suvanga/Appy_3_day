name: Deploy Backend to AWS ECR

# This tells GitHub to run this script ONLY when you push to the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'BISWAS/backend/**' # <-- UPDATED: Now looks inside the BISWAS folder!

jobs:
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log into your AWS Account using your Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 3. Log into the specific ECR Vault
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build the Docker Image and Push it!
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: momentum-backend
        IMAGE_TAG: latest
      run: |
        cd BISWAS/backend # <-- UPDATED: Now navigates to the correct folder!
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG